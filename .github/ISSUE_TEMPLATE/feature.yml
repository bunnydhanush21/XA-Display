name: Feature
description: A change that fits the iOS 12 and public-API constraints
title: "feat: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Which process changes (iPad, host, or protocol), and whether it needs CGEvent, Accessibility, or a new message type.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This stays on public CGEvent and AXUIElement
        - label: This does not add GPL or LGPL source
        - label: This still builds for iOS 12 with Xcode 16.4
