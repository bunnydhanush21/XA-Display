<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Screenshot placeholder</title>
  <desc id="desc">Not a product screenshot. Replace this file with a real capture before publishing images of the app.</desc>
  <rect width="960" height="540" fill="#161b24"/>
  <rect x="24" y="24" width="912" height="492" rx="16" fill="none" stroke="#8eb4ff" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="480" y="230" text-anchor="middle" fill="#f4f6fb" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700">Screenshot placeholder</text>
  <text x="480" y="278" text-anchor="middle" fill="#b7c0d4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">This is not a capture of XA Display.</text>
  <text x="480" y="312" text-anchor="middle" fill="#b7c0d4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Replace docs/assets/screenshot-placeholder.svg with a real PNG or GIF</text>
  <text x="480" y="346" text-anchor="middle" fill="#b7c0d4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">after a session on the iPad mini 3 and the Mac.</text>
</svg>
